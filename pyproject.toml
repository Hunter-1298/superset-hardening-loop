[project]
name = "hardening-loop"
version = "0.1.0"
description = "Event-driven CVE remediation loop for the Hunter-1298/superset fork"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlmodel>=0.0.22,<0.1",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "packaging>=24.0",
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "respx>=0.21,<1",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-jsonschema",
]

[project.scripts]
hardening-loop = "hardening_loop.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hardening_loop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
tmp_path_retention_policy = "failed"
filterwarnings = ["error::DeprecationWarning:hardening_loop.*"]
