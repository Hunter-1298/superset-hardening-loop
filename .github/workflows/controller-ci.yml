name: controller-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy hardening_loop tests
      - run: pytest -q
      - name: no-spend replay (all scenarios, zero outbound network)
        run: hardening-loop replay --out data/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-report
          path: |
            data/replay/replay-report.md
            data/replay/replay.sqlite3
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
      - name: replay inside the image (network_mode none)
        run: docker compose run --rm replay
      - name: dashboard serves the replay database read-only
        run: |
          HL_ACU_COST_USD=2.25 docker compose up -d dashboard
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/report
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/issues)" = "405"
          docker compose down -v
